name: Publish

# Publishes to npm when a GitHub Release is published. Tag the release `v<version>`
# matching package.json (e.g. v0.2.0) — the job below refuses to publish otherwise.
# Can also be triggered manually from the Actions tab.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required for npm provenance (supply-chain attestation)

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: npm
      - run: npm ci

      # A GitHub Release can be cut against any tag, while npm publishes whatever version
      # package.json happens to hold — nothing tied the two together, which is exactly how the
      # repo ended up carrying a v1.0.0 tag while npm was on 0.1.x. Fail loudly instead of
      # publishing a version nobody asked for. Skipped on workflow_dispatch (no tag to compare).
      - name: Verify the release tag matches package.json
        if: github.event_name == 'release'
        run: |
          pkg="$(node -p "require('./package.json').version")"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$pkg" != "$tag" ]; then
            echo "::error::release tag '$GITHUB_REF_NAME' does not match package.json version '$pkg' — bump one of them and re-cut the release"
            exit 1
          fi
          echo "publishing $pkg from tag $GITHUB_REF_NAME"

      # npm publish runs prepublishOnly (typecheck + lint + build + test) first,
      # so a broken build never reaches the registry.
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
