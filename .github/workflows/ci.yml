name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# The library requires Node >= 22.3 (save()/preview() use process.getBuiltinModule, added there).
# Node 22 is the LTS floor, 24 is current — both run the full pipeline including the demos, which
# exercise the real library end to end (getBuiltinModule + save() writing a PDF).
jobs:
  verify:
    name: verify (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      # build before test on purpose: the cross-entry registry tests exercise the real dist
      # bundles (the CJS plugin-registry bug only exists in how tsup splits the entry points,
      # not in the source) and skip themselves when dist/ is missing
      - run: npm run build
      - run: npm test
      # the README advertises browser support, and nothing above can check it: typecheck, lint and
      # the tests all run on Node, where the Node builtins exist and nothing is tree-shaken. Both
      # browser bugs this project has had were invisible to all of them and only showed at bundle
      # time — see scripts/check-browser-bundle.mjs
      - run: npm run check:browser
      - run: npm run demo
